plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new RuntimeException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '3'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.2'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.dime.tomotomo"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        // flutter_local_notifications requires this; without it the Android
        // build fails at :app:checkDebugAarMetadata before compiling anything.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.kotlin.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // AdMob app id comes from CI (-PadmobAppId=...), not from a value checked
        // into the repo. Falls back to Google's public TEST id so a local build
        // works without an AdMob account — a release built without the property
        // will serve test ads, which earn nothing.
        // `+=`, not `=`: assigning wipes Flutter's own placeholders (applicationName)
        // and the manifest merger then fails on ${applicationName}.
        manifestPlaceholders += [
            admobAppId: (project.findProperty('admobAppId')
                ?: 'ca-app-pub-3940256099942544~3347511713')
        ]
        applicationId "com.dime.tomotomo"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'].trim())
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

// home_widget 0.9.0 pulls `androidx.glance:glance-appwidget:1.+`, which now
// resolves to a 1.3.0-alpha that requires AGP 9.1+. Pin to the latest stable
// glance so the build works with the project's pinned AGP.
configurations.all {
    resolutionStrategy {
        force 'androidx.glance:glance-appwidget:1.1.1'
        force 'androidx.glance:glance:1.1.1'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
